<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Scraper Client</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero-panel">
      <div class="brand-row">
        <div class="brand-mark">S</div>
        <div>
          <div class="app-name">Shark Scrap</div>
          <div class="domain" id="domain-label">-</div>
        </div>
      </div>

      <div class="hero-copy">
        <h1>Export produktów w jednym kliknięciu</h1>
        <p id="start-url-label">-</p>
      </div>

      <label class="domain-form">
        <span>Twoja domena do linków zdjęć</span>
        <input id="image-base-url-input" type="text" placeholder="mojadomena.pl" autocomplete="off" />
        <small>Wynik: https://twojadomena.pl/produkty/[sku].[rozszerzenie]</small>
      </label>

      <details class="settings-drawer">
        <summary>
          <span>Codex connector</span>
          <small id="ai-status-label">Brak klucza API - AI jest wyłączone</small>
        </summary>
        <label class="domain-form settings-field">
          <span>Local/dev token AI</span>
          <input id="openai-api-key-input" type="password" placeholder="Wklej token połączenia" autocomplete="off" />
          <small>Używany tylko w Local mode. W Cloud mode model i sekrety wybiera backend.</small>
        </label>
        <div class="settings-actions">
          <button id="save-ai-settings-btn" type="button" class="settings-btn">Connect</button>
          <button id="clear-ai-settings-btn" type="button" class="settings-btn ghost">Disconnect</button>
        </div>
      </details>

      <div class="action-grid" aria-label="Generowanie plików">
        <button id="export-csv-btn" class="action-btn csv">
          <span>Generate</span>
          <strong>CSV</strong>
        </button>
        <button id="export-excel-btn" class="action-btn xlsx">
          <span>Generate</span>
          <strong>XLSX</strong>
        </button>
        <button id="export-json-preview-btn" class="action-btn json">
          <span>Generate</span>
          <strong>JSON</strong>
        </button>
        <button id="export-images-btn" class="action-btn images">
          <span>Download</span>
          <strong>Images</strong>
        </button>
      </div>

      <section class="framework-box">
        <div class="framework-head">
          <div>
            <span>Pełny eksport</span>
            <strong id="framework-mode-title">Framework</strong>
          </div>
          <button id="check-bridge-btn" type="button" class="settings-btn ghost">Sprawdź</button>
        </div>
        <div class="runtime-switch" role="radiogroup" aria-label="Tryb API">
          <label>
            <input id="framework-mode-local" type="radio" name="framework-mode" value="local" checked />
            <span>Local</span>
          </label>
          <label>
            <input id="framework-mode-cloud" type="radio" name="framework-mode" value="cloud" />
            <span>Cloud</span>
          </label>
        </div>
        <label id="local-api-field" class="domain-form framework-url-field runtime-field">
          <span>Local API</span>
          <input id="bridge-base-url-input" type="text" placeholder="http://127.0.0.1:8765" autocomplete="off" />
        </label>
        <label id="cloud-api-field" class="domain-form framework-url-field runtime-field" hidden>
          <span>Cloud API</span>
          <input id="cloud-base-url-input" type="text" placeholder="http://127.0.0.1:8766" autocomplete="off" />
        </label>
        <label id="cloud-user-field" class="domain-form framework-url-field runtime-field" hidden>
          <span>Dev user</span>
          <input id="cloud-user-id-input" type="text" placeholder="dev-user" autocomplete="off" />
        </label>
        <button id="framework-export-btn" type="button" class="framework-btn">
          <span>Uruchom pełny eksport</span>
          <strong id="bridge-status-label">nie sprawdzono</strong>
        </button>
        <div id="framework-job-progress" class="subtle">Framework: nie sprawdzono połączenia</div>
        <div id="framework-outputs" class="framework-outputs" hidden></div>
      </section>

      <div id="scan-progress-wrap" class="progress-wrap" hidden>
        <div class="progress-bar"><div id="scan-progress-fill" class="progress-fill"></div></div>
        <div id="scan-progress-text" class="subtle">-</div>
      </div>
      <ul id="scan-warnings" class="warnings" hidden></ul>
      <div id="images-export-progress" class="subtle" hidden></div>
      <div class="subtle" id="output-folder-label">Folder wyjściowy: nie wybrano</div>
    </section>

    <section class="results-panel" id="results-card" hidden>
      <div class="results-head">
        <div>
          <span>Produkty</span>
          <strong id="results-count">0</strong>
        </div>
      </div>
      <div class="table-wrap">
        <table class="results-table">
          <thead>
            <tr>
              <th>Nazwa</th>
              <th>SKU</th>
              <th>Cena</th>
              <th>Zdjęcia</th>
              <th>Status</th>
              <th>URL</th>
            </tr>
          </thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="app-hidden" aria-hidden="true">
      <button id="scan-btn" type="button">Skanuj</button>
      <button id="stop-scan-btn" type="button">Stop</button>
      <button id="change-folder-btn" type="button">Folder</button>
      <input type="checkbox" id="use-ai-checkbox" />
      <input id="image-brand-input" type="hidden" value="" />

      <input id="mode-select" type="hidden" value="requests" />
      <input id="source-name-input" type="hidden" />
      <input id="base-url-input" type="hidden" />
      <input id="start-url-input" type="hidden" />
      <input id="item-selector-input" type="hidden" />
      <input id="url-selector-input" type="hidden" />
      <input id="url-attr-input" type="hidden" value="href" />
      <input id="pagination-mode-select" type="hidden" value="none" />
      <input id="next-selector-input" type="hidden" />
      <input id="load-more-selector-input" type="hidden" />
      <input id="max-pages-input" type="hidden" value="20" />
      <textarea id="notes-textarea"></textarea>

      <button id="detect-btn" type="button"></button>
      <div id="fields-list"></div>
      <button id="detect-listing-btn" type="button"></button>
      <div id="listing-summary"></div>

      <input id="openai-model-input" type="hidden" />
      <pre id="log-output"></pre>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="main.js"></script>
</body>
</html>
